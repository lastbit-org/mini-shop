steps:
  - name: python:3.14-slim
    id: pytest
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir -r requirements-dev.txt
        pytest -q
  - name: gcr.io/cloud-builders/docker
    args:
      - "build"
      - "-t"
      - "us-east1-docker.pkg.dev/$PROJECT_ID/docker-epsilon/mini-shop"
      - "."

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  pool:
    name: "projects/lastbit-prj-d-project-epsilon/locations/us-east1/workerPools/wp-934509345"

images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/docker-epsilon/mini-shop
